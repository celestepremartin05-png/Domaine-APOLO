<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#071027">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pégase">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="icon" type="image/png" href="icon-192.png">

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
#authGate{position:fixed;inset:0;z-index:2000;background:radial-gradient(1200px 600px at 50% -10%,#1b2d57 0,#071027 60%);display:flex;align-items:center;justify-content:center;padding:20px;font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;color:#24364c}
#authGate[hidden]{display:none}
.ag-card{width:min(420px,100%);background:#fff;border-radius:20px;padding:26px 22px 22px;box-shadow:0 30px 80px rgba(0,0,0,.35);display:grid;gap:14px}
.ag-brand{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.ag-brand img{width:52px;height:52px;border-radius:12px;object-fit:cover;background:#071027}
.ag-brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#4a7fae;font-weight:700}
.ag-brand b{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:30px;color:#071027;line-height:1}
.ag-card h1{font-size:19px;margin:0}
.ag-card p{margin:0;font-size:14px;color:#71849a;line-height:1.45}
.ag-card label{display:grid;gap:5px;font-size:13px;font-weight:600;color:#4b5d73}
.ag-card input{height:48px;border:1px solid #d8e6f4;border-radius:12px;padding:0 14px;font:inherit;font-size:16px;background:#f5f9fe;color:#24364c}
.ag-card input:focus{outline:2px solid #86b5e8;outline-offset:1px;background:#fff}
.ag-card input.code{letter-spacing:.5em;text-align:center;font-size:24px;font-weight:700}
.ag-btn{height:50px;border:0;border-radius:12px;background:#2c64a8;color:#fff;font:inherit;font-size:16px;font-weight:700;cursor:pointer}
.ag-btn:disabled{opacity:.6;cursor:wait}
.ag-link{border:0;background:none;color:#2c64a8;font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:4px;justify-self:center}
.ag-tabs{display:grid;grid-template-columns:1fr 1fr;background:#ebf3fc;border-radius:12px;padding:4px;gap:4px}
.ag-tabs button{border:0;background:none;border-radius:9px;height:40px;font:inherit;font-weight:700;color:#4b5d73;cursor:pointer}
.ag-tabs button[aria-pressed="true"]{background:#fff;color:#071027;box-shadow:0 1px 4px rgba(20,40,70,.12)}
.ag-err{background:#fde3e5;color:#b8424c;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.ag-ok{background:#e2f4e8;color:#2c7a4a;border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
.ag-out{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:4px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
@media (max-width:760px){body.pg-in .hdr-r .today-date{display:none}}
</style>
</head>
<body>
<div id="authGate"><div class="ag-card" id="agCard"></div></div>
<script>
/* ================= Pégase en ligne : connexion + base de données Supabase ================= */
(function(){
  const CFG=window.PEGASE_CONFIG||{};
  const gate=document.getElementById("authGate"),card=document.getElementById("agCard");
  const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  if(!CFG.url||!CFG.anonKey||!window.supabase){card.innerHTML='<h1>Pégase n\'est pas encore relié à sa base de données</h1><p>Il manque l\'adresse Supabase dans le fichier config.js.</p>';return}
  const sb=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:false,autoRefreshToken:true,detectSessionInUrl:false}});
  const st={mode:"login",email:"",msg:"",err:""};
  const logo=()=>{const l=document.querySelector(".brand .logo");return l&&l.src?'<img src="'+l.src+'" alt="">':""};
  function trad(e){const m=String((e&&e.message)||e||"");
    if(/Invalid login credentials/i.test(m))return "E-mail ou mot de passe incorrect.";
    if(/Email not confirmed/i.test(m))return "Votre adresse n'est pas encore vérifiée. Inscrivez-vous à nouveau pour recevoir un code.";
    if(/Database error saving new user|non autoris/i.test(m))return "Cette adresse e-mail n'est pas autorisée à utiliser Pégase.";
    if(/already registered|already been registered/i.test(m))return "Un compte existe déjà avec cette adresse : connectez-vous.";
    if(/Password should be at least|weak/i.test(m))return "Le mot de passe doit faire au moins 8 caractères.";
    if(/expired|invalid.*(otp|token)|Token has expired/i.test(m))return "Code incorrect ou expiré. Vérifiez le dernier e-mail reçu.";
    if(/rate limit|security purposes/i.test(m))return "Trop d'essais d'un coup. Patientez une minute et réessayez.";
    return "Une erreur est survenue : "+m}
  function draw(){
    const tabs=(st.mode==="login"||st.mode==="signup")?'<div class="ag-tabs"><button type="button" data-m="login" aria-pressed="'+(st.mode==="login")+'">Connexion</button><button type="button" data-m="signup" aria-pressed="'+(st.mode==="signup")+'">Inscription</button></div>':"";
    let f="";
    if(st.mode==="login")f='<h1>Bonjour 👋</h1><p>Connectez-vous avec votre adresse e-mail et votre mot de passe.</p><label>E-mail<input id="agEmail" type="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" value="'+esc(st.email)+'"></label><label>Mot de passe<input id="agPwd" type="password" autocomplete="current-password"></label><button class="ag-btn" data-go="login">Se connecter</button><button class="ag-link" data-m="forgot">Mot de passe oublié ?</button>';
    if(st.mode==="signup")f='<h1>Créer mon compte</h1><p>Une seule fois. Seules les adresses autorisées peuvent s\'inscrire.</p><label>E-mail<input id="agEmail" type="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" value="'+esc(st.email)+'"></label><label>Mot de passe (8 caractères minimum)<input id="agPwd" type="password" autocomplete="new-password"></label><label>Confirmer le mot de passe<input id="agPwd2" type="password" autocomplete="new-password"></label><button class="ag-btn" data-go="signup">M\'inscrire</button>';
    if(st.mode==="code")f='<h1>Code de vérification</h1><p>Nous avons envoyé un code à <b>'+esc(st.email)+'</b>. Regardez aussi dans les courriers indésirables.</p><label>Code reçu par e-mail<input id="agCode" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></label><button class="ag-btn" data-go="verify">Valider</button><button class="ag-link" data-go="resend">Renvoyer le code</button><button class="ag-link" data-m="login">Retour</button>';
    if(st.mode==="forgot")f='<h1>Mot de passe oublié</h1><p>Indiquez votre e-mail : vous recevrez un code pour choisir un nouveau mot de passe.</p><label>E-mail<input id="agEmail" type="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" value="'+esc(st.email)+'"></label><button class="ag-btn" data-go="forgot">Recevoir un code</button><button class="ag-link" data-m="login">Retour</button>';
    if(st.mode==="reset")f='<h1>Nouveau mot de passe</h1><p>Code envoyé à <b>'+esc(st.email)+'</b>.</p><label>Code reçu par e-mail<input id="agCode" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8"></label><label>Nouveau mot de passe<input id="agPwd" type="password" autocomplete="new-password"></label><label>Confirmer<input id="agPwd2" type="password" autocomplete="new-password"></label><button class="ag-btn" data-go="reset">Enregistrer et me connecter</button><button class="ag-link" data-m="login">Retour</button>';
    card.innerHTML='<div class="ag-brand">'+logo()+'<div><small>Domaine Apolo · Marrakech</small><b>Pégase</b></div></div>'+tabs+(st.err?'<div class="ag-err">'+esc(st.err)+'</div>':"")+(st.msg?'<div class="ag-ok">'+esc(st.msg)+'</div>':"")+f;
    const first=card.querySelector("input");if(first&&!first.value)first.focus();
  }
  const val=id=>{const e=document.getElementById(id);return e?e.value.trim():""};
  async function act(k,btn){
    st.err="";st.msg="";const clean=x=>x.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,"").toLowerCase();const email=val("agEmail")||st.email;if(val("agEmail"))st.email=clean(email);
    const busy=()=>{if(btn){btn.disabled=true;btn.textContent="Un instant…"}};
    try{
      if(k==="login"){if(!st.email||!val("agPwd")){st.err="Indiquez votre e-mail et votre mot de passe.";return draw()}busy();
        const {error}=await sb.auth.signInWithPassword({email:st.email,password:val("agPwd")});if(error)throw error;return start()}
      if(k==="signup"){const p=val("agPwd");if(!st.email||!p){st.err="Indiquez votre e-mail et un mot de passe.";return draw()}if(p.length<8){st.err="Le mot de passe doit faire au moins 8 caractères.";return draw()}if(p!==val("agPwd2")){st.err="Les deux mots de passe ne sont pas identiques.";return draw()}busy();
        const {data,error}=await sb.auth.signUp({email:st.email,password:p});if(error)throw error;
        if(data&&data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length){st.err="Un compte existe déjà avec cette adresse : connectez-vous.";st.mode="login";return draw()}
        if(data&&data.session)return start();st.mode="code";st.msg="Code envoyé ✓";return draw()}
      if(k==="verify"){const c=val("agCode");if(!c){st.err="Tapez le code reçu par e-mail.";return draw()}busy();
        const {error}=await sb.auth.verifyOtp({email:st.email,token:c,type:"signup"});if(error)throw error;return start()}
      if(k==="resend"){busy();const {error}=await sb.auth.resend({type:"signup",email:st.email});if(error)throw error;st.msg="Nouveau code envoyé ✓";return draw()}
      if(k==="forgot"){if(!st.email){st.err="Indiquez votre e-mail.";return draw()}busy();const {error}=await sb.auth.resetPasswordForEmail(st.email);if(error)throw error;st.mode="reset";st.msg="Code envoyé ✓";return draw()}
      if(k==="reset"){const c=val("agCode"),p=val("agPwd");if(!c||!p){st.err="Tapez le code et le nouveau mot de passe.";return draw()}if(p.length<8){st.err="Le mot de passe doit faire au moins 8 caractères.";return draw()}if(p!==val("agPwd2")){st.err="Les deux mots de passe ne sont pas identiques.";return draw()}busy();
        const {error}=await sb.auth.verifyOtp({email:st.email,token:c,type:"recovery"});if(error)throw error;const r=await sb.auth.updateUser({password:p});if(r.error)throw r.error;return start()}
    }catch(e){const raw=String((e&&e.message)||e||"");st.err=trad(e)+(raw&&!/^Une erreur/.test(trad(e))?" ("+raw+")":"");draw()}
  }
  card.addEventListener("click",e=>{const m=e.target.closest("[data-m]");if(m){const em=val("agEmail");if(em)st.email=em.toLowerCase();st.mode=m.dataset.m;st.err="";st.msg="";draw();return}const g=e.target.closest("[data-go]");if(g)act(g.dataset.go,g)});
  card.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const b=card.querySelector(".ag-btn");if(b){e.preventDefault();b.click()}});

  /* ---------- pont « claude.use » -> Supabase ---------- */
  function colOfPath(p){return p.slice(0,p.lastIndexOf("/"))}
  const colCache={},colSubs={},docCache={},docSubs={};
  const emitCol=c=>{const m=colCache[c];if(!m)return;const docs=[...m].map(([id,d])=>({id,data:()=>d}));(colSubs[c]||[]).forEach(cb=>{try{cb({docs})}catch(_){}})};
  const emitDoc=p=>{const v=docCache[p];(docSubs[p]||[]).forEach(cb=>{try{cb({exists:v!=null,data:()=>v})}catch(_){}})};
  function local(path,data){const c=colOfPath(path),id=path.slice(c.length+1);if(colCache[c]){if(data==null)colCache[c].delete(id);else colCache[c].set(id,data);emitCol(c)}if(path in docCache){docCache[path]=data;emitDoc(path)}}
  const db={
    collection(c){return{onSnapshot(cb,err){(colSubs[c]=colSubs[c]||[]).push(cb);
      if(!colCache[c]){colCache[c]=new Map();sb.from("docs").select("path,data").eq("col",c).then(({data,error})=>{if(error){err&&err(error);return}(data||[]).forEach(r=>colCache[c].set(r.path.slice(c.length+1),r.data));emitCol(c)})}else setTimeout(()=>emitCol(c),0);
      return()=>{colSubs[c]=(colSubs[c]||[]).filter(x=>x!==cb)}}}},
    doc(path){return{
      async set(data){const {error}=await sb.from("docs").upsert({path,col:colOfPath(path),data,updated_at:new Date().toISOString()});if(error)throw error;local(path,data)},
      async delete(){const {error}=await sb.from("docs").delete().eq("path",path);if(error)throw error;local(path,null)},
      onSnapshot(cb,err){(docSubs[path]=docSubs[path]||[]).push(cb);
        sb.from("docs").select("data").eq("path",path).maybeSingle().then(({data,error})=>{if(error){err&&err(error);return}docCache[path]=data?data.data:null;emitDoc(path)});
        return()=>{docSubs[path]=(docSubs[path]||[]).filter(x=>x!==cb)}}}}
  };
  let role=null,uid=null;
  async function start(){
    const {data:{user}}=await sb.auth.getUser();if(!user){st.err="Connexion impossible, réessayez.";return draw()}
    uid=user.id;const r=await sb.from("allowed").select("role").maybeSingle();role=r.data&&r.data.role;
    if(!role){await sb.auth.signOut();st.mode="login";st.err="Connectée, mais adresse absente de la liste autorisée ("+(user.email||"")+(r.error?" · "+r.error.message:"")+").";return draw()}
    sb.channel("pegase-docs").on("postgres_changes",{event:"*",schema:"public",table:"docs"},pl=>{const row=pl.new&&pl.new.path?pl.new:null;const path=row?row.path:(pl.old&&pl.old.path);if(!path)return;local(path,pl.eventType==="DELETE"?null:row.data)}).subscribe();
    window.claude={use:async n=>n==="db"?db:n==="user"?{isOwner:async()=>role==="owner",canEdit:async()=>role==="owner"||role==="editor",id:async()=>uid}:n==="downloads"?{save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}}:null};
    gate.hidden=true;document.body.classList.add("pg-in");
    const hr=document.querySelector(".hdr-r");if(hr&&!document.getElementById("agOut")){const b=document.createElement("button");b.id="agOut";b.className="ag-out";b.textContent="Se déconnecter";b.onclick=async()=>{await sb.auth.signOut();location.reload()};hr.appendChild(b)}
    if(window.__pegaseBoot)window.__pegaseBoot();
    if(role==="owner"){const c=await sb.from("docs").select("path",{count:"exact",head:true});if(!c.error&&(c.count===0||location.hash==="#import"))showImport()}
  }
  function showImport(){const o=document.createElement("div");o.id="agImp";o.style.cssText="position:fixed;inset:0;z-index:2100;background:rgba(7,16,39,.6);display:flex;align-items:center;justify-content:center;padding:20px";
    o.innerHTML='<div class="ag-card"><h1>Importer vos données</h1><p>Votre Pégase en ligne est vide. Tapez le code d\'import que Claude vous a donné pour y recopier vos prospects, votre calendrier, vos chevaux, vos offres…</p><label>Code d\'import<input id="impPw" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX"></label><div id="impMsg"></div><button class="ag-btn" id="impGo">Importer</button><button class="ag-link" id="impNo">Plus tard</button></div>';
    document.body.appendChild(o);
    o.querySelector("#impNo").onclick=()=>o.remove();
    o.querySelector("#impGo").onclick=async()=>{const b=o.querySelector("#impGo"),m=o.querySelector("#impMsg");const pw=o.querySelector("#impPw").value.trim().toUpperCase().replace(/\s+/g,"");if(!pw)return;b.disabled=true;b.textContent="Import en cours…";m.innerHTML="";
      try{const r=await fetch("import.json",{cache:"no-store"});if(!r.ok)throw new Error("Fichier d'import introuvable");const j=await r.json();
        const u8=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
        const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
        const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(j.salt),iterations:310000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
        let plain;try{plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(j.iv)},key,u8(j.ct))}catch(_){throw new Error("Code incorrect")}
        const docs=JSON.parse(new TextDecoder().decode(plain)).map(d=>({...d,updated_at:new Date().toISOString()}));
        const {error}=await sb.from("docs").upsert(docs);if(error)throw error;
        docs.forEach(d=>local(d.path,d.data));
        m.innerHTML='<div class="ag-ok">✓ '+docs.length+' fiches importées</div>';b.textContent="Terminé";setTimeout(()=>o.remove(),1500);
      }catch(e){m.innerHTML='<div class="ag-err">'+esc(e.message||String(e))+'</div>';b.disabled=false;b.textContent="Importer"}};
  }
  window.addEventListener("DOMContentLoaded",draw);
})();
</script>
<title>Pégase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: logiciel du domaine — en-tête bordeaux, onglets, une colonne de contenu ; fiches prospect en panneau latéral, pages de détail en pleine largeur */
:root{
  /* Un seul thème, clair et bleu ciel, choisi pour donner envie d'ouvrir l'outil */
  color-scheme:light;
  --bg:#f5f9fe; --surface:#ffffff; --sunk:#ebf3fc; --line:#d8e6f4;
  --ink:#24364c; --muted:#71849a; --wine:#3d7fcc; --wine-soft:#e4f0fc; --rose:#86b5e8; --blush:#e1eefb; --band:#2c64a8; --band-ink:#ffffff; --band-soft:#cfe2f8;
  --gold:#b98226; --gold-soft:#fbf0dc;
  --ok:#3f9061; --ok-soft:#e2f4e8; --warn:#bf7a1c; --warn-soft:#fdf0db; --bad:#cf4554; --bad-soft:#fde3e5; --info:#4a7fae; --info-soft:#e4eff8;
  --k-event:#2a78d6; --k-brunch:#eda100; --k-show:#e87ba4; --k-form:#6250d6; --k-cours:#1baf7a; --k-rdv:#eb6834; --k-other:#71849a; --k-perso:#9aa6b2;
  --s-new:#e4f0fd; --s-new-b:#79ade6; --s-new-t:#2f6aa8; --s-mid:#f0e9fc; --s-mid-b:#a78ae0; --s-mid-t:#6a4bb0; --s-ok:#e2f5e9; --s-ok-b:#6cc28a; --s-ok-t:#2c7a4a; --s-lost:#fde6e6; --s-lost-b:#ec8f8f; --s-lost-t:#b8424c;
  --display:"Young Serif",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
html{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,[data-item],[data-open],[data-day],.ev,.lead,label{touch-action:manipulation}
button:active,.lead:active,.item:active,.ev:active,.cal-day:active,.callbtn:active{transform:scale(.97);opacity:.85;transition:transform .05s}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding:16px 20px;border-radius:16px;background:#071027;border:0}
header.top .brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:64px;height:64px;flex:none;border-radius:12px;box-shadow:0 0 0 1px rgba(214,174,92,.35)}
@media (max-width:760px){.brand .logo{width:50px;height:50px}}
.brand small{color:var(--band-soft)}
header.top .brand h1{color:#f1d58e;letter-spacing:.06em}
header.top .today-date{color:#c9d2e3;text-transform:capitalize}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);font-weight:700}
.brand h1{font-family:var(--display);font-weight:400;font-size:30px;margin:2px 0 0;line-height:1.1;color:var(--wine)}
.today-date{color:var(--muted);font-size:14px}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px;margin-top:20px;align-items:start}
nav.tabs{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
nav.tabs button{font:inherit;font-weight:600;font-size:15px;border:0;border-left:3px solid transparent;background:none;color:var(--muted);padding:11px 12px;border-radius:0 8px 8px 0;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:8px}
nav.tabs button[aria-selected="true"]{background:var(--band);color:var(--band-ink);border-left-color:var(--band);border-radius:8px}
nav.tabs button:hover:not([aria-selected="true"]){background:var(--sunk);color:var(--ink)}
.otable{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.ohead,.orow{display:grid;grid-template-columns:5px minmax(0,2.2fr) minmax(0,1.1fr) 110px 130px 120px 14px;gap:14px;align-items:center}
.ohead{padding:10px 16px 10px 0;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}

button,input,select,textarea{font:inherit;color:inherit}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}

.section{display:grid;gap:10px;margin-bottom:28px}

.count{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}

.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:26px}

@media (max-width:640px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.list{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.lead{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:0 14px;align-items:center;padding:12px 14px 12px 0;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:var(--surface);width:100%}

function leaveOk(){
  if(flushAuto()||autoOk()||autoBusy)return true;
  if(!(S.dirty&&S.touched))return true;
  const now=Date.now();if(leaveOk.t&&now-leaveOk.t<6000){leaveOk.t=0;S.dirty=false;S.touched=false;return true}
  leaveOk.t=now;toast("Modifications non enregistrées. Touchez encore pour quitter sans enregistrer.");return false;
}
function go(tab,route){
  if(S.route&&!go.force&&!leaveOk())return;
  if(go.force)flushAuto();S.autoRoute=null;
  go.force=false;S.tab=tab;S.route=route||null;S.draft=null;S.dirty=false;S.touched=false;S.confirmDel=false;render();window.scrollTo(0,0);
}

const BRUNCH={debut:"2026-11-08",h1:"12:00",h2:"16:30",tous:14};
function isBrunchDay(ds){if(ds<BRUNCH.debut)return false;const n=Math.round((parse(ds)-parse(BRUNCH.debut))/864e5);return n%BRUNCH.tous===0}
function nextBrunches(n){const out=[];let ds=today()>BRUNCH.debut?today():BRUNCH.debut;let k=Math.max(0,Math.ceil(Math.round((parse(ds)-parse(BRUNCH.debut))/864e5)/BRUNCH.tous));for(let i=0;i<n;i++)out.push(addDays((k+i)*BRUNCH.tous,BRUNCH.debut));return out}

});

async function openBrunchDate(date){
  const id="brunch-"+date;

  if(!canAgenda()){toast("Aucune réservation pour ce brunch");return}
  S.tab="calendrier";S.route={page:"event",id};S.draft=blankEvent(date,"brunch");S.dirty=true;S.touched=false;S.route.isNew=true;render();window.scrollTo(0,0);
}
function F(label,path,opts){
  opts=opts||{};const v=getP(S.draft,path);const dis=canAgenda()?"":" disabled";
  let inner;
  if(opts.sel)inner='<select data-k="'+path+'"'+dis+'>'+(opts.ph!==undefined?'<option value="">'+opts.ph+'</option>':"")+opts.sel.map(o=>{const [a,b]=Array.isArray(o)?o:[o,o];return '<option value="'+esc(a)+'"'+(String(v??"")===String(a)?" selected":"")+'>'+esc(b)+'</option>'}).join("")+'</select>';
  else if(opts.area)inner='<textarea data-k="'+path+'"'+dis+(opts.ph?' placeholder="'+esc(opts.ph)+'"':"")+'>'+esc(v)+'</textarea>';
  else inner='<input data-k="'+path+'" type="'+(opts.type||"text")+'" value="'+esc(v)+'"'+dis+(opts.ph?' placeholder="'+esc(opts.ph)+'"':"")+(opts.type==="number"?' inputmode="numeric" min="0"':"")+(opts.list?' list="'+opts.list+'"':"")+'>';
  return '<label class="f'+(opts.full?" full":"")+'">'+label+inner+'</label>';
}

function viewFormations(){

  let h='<div class="subtabs">'+sub.filter(([k])=>k!=="guide"||canProspects()).map(([k,l])=>'<button data-ftab="'+k+'" aria-pressed="'+(S.ftab===k)+'">'+l+'</button>').join("")+'</div>';
  if(S.ftab==="guide")return h+viewGuide();
  if(S.ftab==="closing"){
    const L=all().filter(p=>["stages","formation-en-ligne"].includes(ptype(p))&&p.statut!=="perdu");
    const act=L.filter(p=>ACTIFS.includes(p.statut)),won=L.filter(p=>p.statut==="reserve");
    h+='<div class="row" style="margin-bottom:12px"><span class="muted">Les demandes de formation de vos prospects, avec la prochaine action pour chacune.</span><span class="spacer"></span>'+(canProspects()?'<button class="btn primary" data-newprospect="stages">+ Nouveau prospect formation</button>':"")+'</div>';
    h+='<section class="section"><div class="section-head"><h2>En cours de closing</h2><span class="count">'+act.length+'</span></div>'+(act.length?'<div class="list">'+act.sort((a,b)=>(nextOf(a)?.date||"9").localeCompare(nextOf(b)?.date||"9")).map(p=>leadRow(p,true)).join("")+'</div>':'<div class="empty">Aucun prospect formation en cours.</div>')+'</section>';
    h+='<section class="section"><div class="section-head"><h2>Inscrits</h2><span class="count">'+won.length+'</span></div>'+(won.length?'<div class="list">'+won.map(p=>leadRow(p,true)).join("")+'</div>':'<div class="empty">Aucune inscription pour l\'instant.</div>')+'</section>';

}

const RCOL={"Homme à tout faire":["#b07d00","#fff1c7"],"Cuisine":["#e0782f","#fdeee2"],"Femme de ménage":["#e0606a","#fdeaec"],"Service":["#cf8a2e","#fbf0dd"],"Palefrenier":["#8a5a2b","#f2e9df"],"Jardinier":["#3c9a4c","#e5f4e7"],"Gardien":["#3f6fb5","#e8eff9"],"Autre":["#7a8494","#eef0f3"]};
function staffCol(st){if(st&&(st.epingle===true||st.epingle==="true"||/tout faire/i.test(st.role||"")))return RCOL["Homme à tout faire"];return RCOL[st&&st.role]||RCOL.Autre}
function staffColVars(st){const c=staffCol(st);return "--pc:"+c[0]+";--pb:"+c[1]}
function staffList(){return Object.keys(S.personnel).map(id=>({...S.personnel[id],_id:id}))}
function worksOn(st,ds){const ps=(st.passages||{})[ds]||{};if(st.debut&&ds<st.debut)return !!ps.ajout;if(ps.ajout)return true;return (st.jours||[]).map(Number).includes(parse(ds).getDay())}
function shiftOf(st,ds){const ps=(st.passages||{})[ds]||{};return {ds,paye:!!ps.paye,absent:!!ps.absent,montant:ps.montant!==undefined&&ps.montant!==""?num(ps.montant):num(st.tarif),ajout:!!ps.ajout}}
function shiftsBetween(st,from,to){const out=[];let d=parse(from);const end=parse(to);while(d<=end){const ds=iso(d);if(worksOn(st,ds))out.push(shiftOf(st,ds));d.setDate(d.getDate()+1)}return out}
function isMois(st){return st&&st.paie==="mois"}
function moisOf(st,mk){const x=(st.mois||{})[mk]||{};return {mk,paye:!!x.paye,montant:x.montant!==undefined&&x.montant!==""?num(x.montant):Math.max(0,num(st.tarif)-avancesOf(st,mk))}}
function moisBetween(st,from,to){const out=[];let y=Number(from.slice(0,4)),m=Number(from.slice(5,7));while(true){const mk=y+"-"+pad(m);if(mk>to)break;out.push(moisOf(st,mk));m++;if(m>12){m=1;y++}}return out}
function moisPaidIn(st,m){const x=(st.mois||{})[m];return isMois(st)&&x&&x.paye?moisOf(st,m).montant:0}
function penMois(c){if(c.proprio!=="pension")return [];const tm=today().slice(0,7);let to=c.pensionFin&&c.pensionFin.slice(0,7)<tm?c.pensionFin.slice(0,7):tm;const ks=Object.keys(c.pensionMois||{}).sort();const from=c.pensionDebut?c.pensionDebut.slice(0,7):(ks[0]&&ks[0]<tm?ks[0]:tm);if(to<from)return [];
  const out=[];let y=Number(from.slice(0,4)),m=Number(from.slice(5,7));while(true){const mk=y+"-"+pad(m);if(mk>to)break;const x=(c.pensionMois||{})[mk]||{};out.push({mk,paye:!!x.paye,payeLe:x.payeLe||"",montant:x.montant!==undefined&&x.montant!==""?num(x.montant):num(c.pensionPrix)});m++;if(m>12){m=1;y++}}return out}
function penDue(c){const tm=today().slice(0,7);return penMois(c).filter(x=>!x.paye&&x.mk<=tm)}
function pensionOfMonth(m){return chevauxList().reduce((s,c)=>s+penMois(c).filter(x=>x.paye&&x.mk===m).reduce((a,x)=>a+x.montant,0),0)}
function owed(st){if(isMois(st)){const t=today().slice(0,7);let f=(st.debut||today()).slice(0,7);const lim=addDays(-180).slice(0,7);if(f<lim)f=lim;return moisBetween(st,f,t).filter(x=>x.mk<t&&!x.paye)}const from=st.debut||today();const sh=shiftsBetween(st,from<addDays(-120)?addDays(-120):from,today());return sh.filter(x=>!x.absent&&!x.paye)}
async function togglePaid(id,ds,field,val){
  const st=clone(S.personnel[id]);st.passages=st.passages||{};const ps=st.passages[ds]||{};ps[field]=val;if(field==="paye"&&val)ps.payeLe=today();st.passages[ds]=ps;
  S.personnel[id]=st;render();
  if(!(await write("personnel/"+id,st)))toast("Pas enregistré, réessayez");
}

  h+='<section class="section" id="sec-pweek"><div class="cal"><div class="cal-head"><button class="btn small" data-pw="-1" aria-label="Semaine précédente">‹</button><h2>'+label+'</h2><button class="btn small" data-pw="1" aria-label="Semaine suivante">›</button>'+(S.pweek?'<button class="btn small ghost" data-pw="0">Revenir à aujourd\'hui</button>':"")+'<span class="spacer"></span><span style="font-size:13px;opacity:.9">'+mon.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+' – '+sun.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})+'</span></div><div class="wkwrap" style="border:0;border-radius:0"><div class="wk">'+cols+'</div></div><div class="legend">'+[...new Set(L.map(st=>st.epingle||/tout faire/i.test(st.role||"")?"Homme à tout faire":(RCOL[st.role]?st.role:"Autre")))].map(r=>'<span><i class="dot" style="background:'+RCOL[r][0]+'"></i>'+esc(r)+'</span>').join("")+'<span class="muted" style="flex-basis:100%">Touchez un prénom, ou une personne dans « L\'équipe » plus bas, pour cocher ce qui est payé.</span></div></div></section>';
  h+='<section class="section" id="sec-staff"><div class="section-head"><h2>L\'équipe</h2><span class="count">'+Lt.length+'</span></div>'+(Lt.length?'<div class="list">'+Lt.map(st=>{const o=owed(st);const tot=o.reduce((a,x)=>a+x.montant,0);return '<button class="item" data-item="staff" data-id="'+esc(st._id)+'"><span class="bar" style="background:'+staffCol(st)[0]+'"></span><span style="min-width:0"><b>'+esc(st.nom||"Sans nom")+(st.exemple?' <span class="chip ex">Exemple</span>':"")+'</b><span class="sub">'+esc([st.role,(st.jours||[]).map(j=>JOURS[j]).join(", "),st.tarif?num(st.tarif).toLocaleString("fr-FR")+(isMois(st)?" DH par mois":" DH par jour"):""].filter(Boolean).join(" · "))+'</span></span><span class="chip '+(tot?"bad":"ok")+'">'+(tot?o.length+(isMois(st)?" mois":" jour"+(o.length>1?"s":""))+" à payer · "+tot.toLocaleString("fr-FR")+" DH":"À jour")+'</span></button>'}).join("")+'</div>':'<div class="empty">Aucune personne enregistrée. Cliquez sur « + Ajouter une personne ».</div>')+'</section>';
  return h;
}

function viewJour(){
  const t=today(),list=all().filter(p=>p.statut!=="perdu");

  list.forEach(p=>{const x=nextOf(p);if(!x){if(ACTIFS.includes(p.statut))none.push(p);return}
    if(x.date<t)late.push(p);else if(x.date===t){(x.type==="appel"?calls:x.type==="message"?msgs:other).push(p)}else if(x.date<=addDays(7))soon.push(p)});
  const by=(a,b)=>(nextOf(a)?.date||"").localeCompare(nextOf(b)?.date||"");late.sort(by);soon.sort(by);

  const pipe=all().filter(p=>ACTIFS.includes(p.statut)).reduce((s,p)=>s+num(p.montant),0);
  let h='<div class="strip">'+cellP(late.length,"En retard",late.length>0)+cellP(calls.length+nouveaux.length,"Appels à passer")+cellP(msgs.length,"Messages de relance")+cellP(money(pipe),"En jeu (prospects actifs)")+'</div>';
  if(!all().length)h+='<div class="empty" style="margin-bottom:24px">Aucun prospect pour l\'instant. Dès qu\'une personne vous donne son numéro sur Instagram, cliquez sur <b>+ Nouveau prospect</b>.</div>';
  h+=sec("En retard",late,"À traiter en premier","bad","Rien en retard. Bravo.");
  h+=sec("Nouveaux à appeler",nouveaux,"Rappeler dans l'heure si possible","warn","Aucune nouvelle demande en attente.");
  h+=sec("Appels prévus aujourd'hui",calls,"","warn","Aucun appel prévu aujourd'hui.");
  h+=sec("Messages à envoyer aujourd'hui",msgs,"Modèles dans le guide d'appel","warn","Aucune relance par message aujourd'hui.");
  if(other.length)h+=sec("Autres actions aujourd'hui",other,"","warn","");
  if(sansAction.length)h+=sec("Sans prochaine action",sansAction,"Un prospect sans date est un prospect oublié","bad","");
  h+=sec("Les 7 prochains jours",soon,"","","Rien de prévu cette semaine.");
  return h;

const SRC_COL={"Instagram (pub)":"#2a78d6","Instagram (message)":"#eb6834","Bouche-à-oreille":"#1baf7a","Site internet":"#eda100","WhatsApp":"#e87ba4","Autre":"#6250d6","Non précisé":"#a9b6c4"};
function monthKeys(n){const out=[];const d=new Date();for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(x.getFullYear()+"-"+pad(x.getMonth()+1))}return out}
function niceMax(v){if(v<=0)return 1000;const p=Math.pow(10,Math.floor(Math.log10(v)));const m=v/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p}
const kfmt=v=>v>=1000?(v/1000).toLocaleString("fr-FR",{maximumFractionDigits:1})+" k":String(v);
function donut(entries){
  const tot=entries.reduce((s,e)=>s+e[1],0);const cx=90,cy=90,R=80,r=50;let a0=-Math.PI/2;let paths="";
  if(entries.length===1){paths='<circle cx="'+cx+'" cy="'+cy+'" r="'+(R+r)/2+'" fill="none" stroke="'+(SRC_COL[entries[0][0]]||"#a9b6c4")+'" stroke-width="'+(R-r)+'"/>'}
  else entries.forEach(([k,v])=>{const a1=a0+v/tot*Math.PI*2;const lg=a1-a0>Math.PI?1:0;const p=(rad,a)=>(cx+rad*Math.cos(a)).toFixed(2)+" "+(cy+rad*Math.sin(a)).toFixed(2);
    paths+='<path d="M '+p(R,a0)+' A '+R+' '+R+' 0 '+lg+' 1 '+p(R,a1)+' L '+p(r,a1)+' A '+r+' '+r+' 0 '+lg+' 0 '+p(r,a0)+' Z" fill="'+(SRC_COL[k]||"#a9b6c4")+'" stroke="var(--surface)" stroke-width="2"><title>'+esc(k)+' : '+v+'</title></path>';a0=a1});
  return '<div class="donutwrap"><svg viewBox="0 0 180 180" width="180" height="180" class="donut" role="img" aria-label="Répartition des demandes par origine">'+paths+'<text x="90" y="88" text-anchor="middle" style="font-family:var(--display);font-size:28px;fill:var(--ink)">'+tot+'</text><text x="90" y="108" text-anchor="middle">demandes</text></svg><div class="slegend">'+entries.map(([k,v])=>'<div><span class="dot" style="background:'+(SRC_COL[k]||"#a9b6c4")+';width:12px;height:12px"></span><span>'+esc(k)+'</span><span class="v">'+v+'</span><span class="muted" style="font-size:13px;text-align:right;min-width:44px">'+Math.round(v/tot*100)+' %</span></div>').join("")+'</div></div>';
}

function viewGuide(){
  return '<div class="guide"><div class="rule">La règle d\'or : on ne raccroche jamais sans une prochaine étape datée. « Je vous rappelle jeudi à 18 h, ça vous va ? »</div>'+
  '<h2>Le déroulé d\'un appel</h2><ol class="steps">'+
  '<li><div><b>Accueillir</b>Remerciez pour la demande, présentez-vous, rappelez d\'où elle vient. « Bonjour, c\'est [prénom] du Domaine Apolo, vous nous avez écrit sur Instagram pour… Vous avez deux minutes ? »</div></li>'+
  '<li><div><b>Comprendre le projet</b>Posez des questions et laissez parler. Notez tout dans la fiche pendant l\'appel.<ul><li>Événement : quelle occasion, quelle date, combien d\'invités, avez-vous déjà un traiteur, souhaitez-vous le spectacle équestre ?</li><li>Brunch ou spectacle : quel dimanche, combien d\'adultes et d\'enfants, une occasion particulière ?</li><li>Cours avec Catherine : quel niveau, quel âge, un cours d\'essai ou un forfait, quelles disponibilités ?</li><li>Formation : laquelle, quel niveau, pour le loisir ou pour en faire un métier ?</li></ul></div></li>'+
  '<li><div><b>Trouver ce qui compte vraiment</b>« Qu\'est-ce qui serait réussi pour vous ? » La réponse (l\'émotion des invités, les enfants près des chevaux, devenir moniteur) est ce que vous mettrez en avant dans la proposition.</div></li>'+
  '<li><div><b>Reformuler</b>« Si je résume : un mariage le 12 avril, 80 personnes, votre traiteur, et un spectacle au coucher du soleil. C\'est bien ça ? » Le client se sent écouté et vous évitez les erreurs.</div></li>'+
  '<li><div><b>Proposer</b>Donnez une offre claire avec un prix ou une fourchette. Si le devis demande du travail, fixez quand vous l\'envoyez : « Je vous l\'envoie demain avant midi. »</div></li>'+
  '<li><div><b>Conclure</b>Demandez la décision simplement. « On bloque la date ? Je vous envoie le lien pour l\'acompte. » Puis taisez-vous et laissez répondre.</div></li>'+
  '<li><div><b>Fixer la suite et noter</b>Pas prêt à décider ? Convenez ensemble d\'une date de rappel, puis mettez à jour le statut et la prochaine action dans la fiche avant de passer à l\'appel suivant.</div></li></ol>'+
  '<h2>Répondre aux objections</h2><div class="obj">'+
  obj("« C\'est trop cher »","Ne baissez pas le prix tout de suite. Demandez : « Par rapport à quoi ? » puis rappelez ce qui est inclus et ce qui rend le lieu unique (les chevaux, le spectacle, le cadre). Si le budget est vraiment limité, proposez une formule plus légère plutôt qu\'une remise.")+
  obj("« Je dois en parler à mon mari / mon associé »","C\'est normal. « Qu\'est-ce qui, selon vous, va l\'intéresser le plus ? » Proposez d\'envoyer un résumé à transmettre, ou une visite à deux. Fixez le rappel : « Je vous rappelle samedi après en avoir parlé ? »")+
  obj("« Je réfléchis et je vous recontacte »","« Bien sûr. Qu\'est-ce qui vous fait hésiter ? » Souvent, il y a une vraie question derrière. Dans tous les cas, c\'est vous qui rappelez : fixez une date.")+

/* ---------- éléments du calendrier ---------- */
function itemsOn(date){

  const d=parse(date);

  elevesList().filter(e=>e.actif!==false).forEach(e=>(e.creneaux||[]).forEach(c=>{if(Number(c.jour)===d.getDay())out.push({ty:offreOfEleve(e),kind:"cours",titre:e.nom||"Élève",heure:c.heure||"",id:e._id,src:"eleve"})}));
  Object.entries(S.occupe).forEach(([id,o])=>{if(o.date!==date)return;const mine=S.uid&&o.auteur===S.uid;const det=mine?S.myPerso[id]:null;

function calNav(v){const c=S.cal;const view=c.view||"mois";

function evAttrs(x,ds){return ' role="link" title="'+esc((x.heure?x.heure+" · ":"")+x.titre)+'" data-item="'+esc(x.src||"virtual")+'" data-id="'+esc(x.id||"")+'" data-date="'+ds+'"'}
function evStyle(x){return x.ty==="perso"?'':'border-left-color:'+tCol(x.ty)+';background:color-mix(in srgb,'+tCol(x.ty)+' 16%,var(--surface))'}
function weekStart(ds){const d=parse(ds);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function calendar(){
  const c=S.cal;if(!c.y){const n=new Date();c.y=n.getFullYear();c.m=n.getMonth();c.sel=today()}if(!c.sel)c.sel=today();
  const view=c.view||"mois";const t=today();let title,body,days=[];

    for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=iso(d);if(i===35&&d.getMonth()!==c.m)break;days.push(ds);
      const items=itemsOn(ds).filter(calPass);

}
function toMin(h){const p=String(h||"0:0").split(":").map(Number);return (p[0]||0)*60+(p[1]||0)}
function rangeOf(x){if(!x.heure)return null;const s=toMin(x.heure);let e=x.fin?toMin(x.fin):s+60;if(e<=s)e=s+60;return [s,e]}
function timeGrid(days,view){
  const H0=7,H1=23,PX=48;const t=today();
  const now=new Date();const nowMin=now.getHours()*60+now.getMinutes();
  let head='<div class="tg-corner"></div>',allday='<div class="tg-lab">Journée</div>',cols="";
  days.forEach(ds=>{const d=parse(ds);const items=itemsOn(ds).filter(calPass);
    head+='<button class="tg-dh'+(ds===t?" today":"")+'" data-dayview="'+ds+'"><span>'+d.toLocaleDateString("fr-FR",{weekday:"short"})+'</span><b>'+d.getDate()+'</b></button>';
    const ad=items.filter(x=>!x.heure);
    allday+='<div class="tg-ad" data-day="'+ds+'">'+ad.map(x=>'<span class="ev'+(x.ty==="perso"?" perso":"")+'"'+evAttrs(x,ds)+' style="'+evStyle(x)+'">'+esc(shortT(x))+'</span>').join("")+'</div>';
    const tm=items.filter(x=>x.heure).map(x=>({x,r:rangeOf(x)})).sort((a,b)=>a.r[0]-b.r[0]);
    const lanes=[];tm.forEach(o=>{let l=lanes.findIndex(end=>end<=o.r[0]);if(l<0){l=lanes.length;lanes.push(0)}lanes[l]=o.r[1];o.l=l});const n=Math.max(1,lanes.length);
    cols+='<div class="tg-col'+(ds===t?" today":"")+'" data-day="'+ds+'" style="height:'+((H1-H0)*PX)+'px">'+tm.map(o=>{const top=Math.max(0,(o.r[0]-H0*60)/60*PX);const hgt=Math.max(22,(o.r[1]-o.r[0])/60*PX-2);
      return '<span class="tg-ev'+(o.x.ty==="perso"?" perso":"")+'"'+evAttrs(o.x,ds)+' style="top:'+top+'px;height:'+hgt+'px;left:calc('+o.l+' * 100% / '+n+');width:calc(100% / '+n+' - 3px);'+evStyle(o.x)+'"><b>'+esc(o.x.heure)+(o.x.fin?" – "+esc(o.x.fin):"")+'</b>'+esc(o.x.titre)+'</span>'}).join("")+
      (ds===t&&nowMin>H0*60&&nowMin<H1*60?'<span class="tg-now" style="top:'+((nowMin-H0*60)/60*PX)+'px"></span>':"")+'</div>';
  });
  let hours='';for(let h=H0;h<H1;h++)hours+='<span style="height:'+PX+'px">'+h+'h</span>';
  return '<div class="tg-wrap"><div class="tg '+(view==="jour"?"tg-day":"tg-week")+'" style="--n:'+days.length+';--px:'+PX+'px">'+head+allday+'<div class="tg-hours">'+hours+'</div>'+cols+'</div></div>';
}

/* ---------- événement : création et fiche ---------- */

async function saveEvent(t){
  const ev=S.draft;if(!ev.date){toast("Indiquez une date");return}
  if(ev.dateFin&&ev.dateFin<ev.date){toast("La date de fin doit être après la date de début");return}
  ev.offre=tyOf(ev);ev.kind=TY_KIND[ev.offre];if(ev.kind!=="formation")ev.dateFin="";
  ev.checklist=(ev.checklist||[]).filter(x=>String(x.txt||"").trim());
  if((ev.devis||[]).length&&ev.kind==="evenement"){ev.devis=ev.devis.filter(l=>String(l.lib||"").trim()||num(l.pu));ev.paiement.total=devisSum(ev)}
  const id=S.route.id||newId("ev");
  const cf=conflictsFor(ev,S.route.id);const sig=(S.route.id||"new")+ev.date+ev.debut+ev.fin+(ev.chevaux||[]).join();
  if(cf.length&&saveEvent.ok!==sig){saveEvent.ok=sig;toast("Chevauchement avec « "+cf[0].titre+" ». Touchez encore Enregistrer pour confirmer.");return}
  saveEvent.ok=null;ev.updatedAt=new Date().toISOString();t.disabled=true;
  if(await write("agenda/"+id,ev)){if(!S.agenda[id])S.agenda[id]=clone(ev);toast("Enregistré");showInCalendar(ev.date)}else t.disabled=false;
}

function depList(){return Object.keys(S.depenses||{}).map(id=>({...S.depenses[id],_id:id}))}
function chevauxList(){return Object.keys(S.chevaux||{}).map(id=>({...S.chevaux[id],_id:id}))}
function depensesOfMonth(m){
  const out=[];
  depList().forEach(d=>{if((d.date||"").slice(0,7)===m)out.push({date:d.date,cat:d.cat||"Autre",lib:d.libelle||d.cat||"Dépense",montant:num(d.montant),paye:d.paye!==false,src:"depense",id:d._id})});
  staffList().forEach(st=>{const v=moisPaidIn(st,m);if(v){const x=st.mois[m];out.push({date:x.payeLe&&x.payeLe.slice(0,7)===m?x.payeLe:m+"-28",cat:"Salaires",lib:"Salaire du mois · "+(st.nom||""),montant:v,paye:true,src:"staff",id:st._id})}});
  staffList().forEach(st=>(st.porteMonnaie||[]).forEach(w=>{if(w.sens==="avance"&&(w.date||"").slice(0,7)===m)out.push({date:w.date,cat:"Salaires",lib:"Avance · "+(st.nom||"").trim()+(w.note?" · "+w.note:""),montant:num(w.montant),paye:true,src:"staff",id:st._id})}));
  staffList().filter(st=>!isMois(st)).forEach(st=>Object.entries(st.passages||{}).forEach(([ds,ps])=>{if(ps.paye&&!ps.absent&&ds.slice(0,7)===m)out.push({date:ds,cat:"Salaires",lib:"Personnel · "+(st.nom||""),montant:shiftOf(st,ds).montant,paye:true,src:"staff",id:st._id})}));
  staffList().forEach(st=>(st.porteMonnaie||[]).forEach(w=>{if(w.sens==="depense"&&(w.date||"").slice(0,7)===m)out.push({date:w.date,cat:"Porte-monnaie",lib:(st.nom||"").trim()+" · "+(w.note||"Dépense"),montant:num(w.montant),paye:true,src:"staff",id:st._id})}));
  chevauxList().forEach(h=>(h.soins||[]).forEach(s=>{if(num(s.cout)&&(s.date||"").slice(0,7)===m)out.push({date:s.date,cat:s.type==="Maréchal-ferrant"?"Maréchal-ferrant":"Vétérinaire",lib:(s.type||"Soin")+" · "+(h.nom||""),montant:num(s.cout),paye:true,src:"cheval",id:h._id})}));
  return out.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
}
function recettesOfMonth(m){const {r}=offreRevenues();return pensionOfMonth(m)+OFFRES.reduce((s,o)=>s+(r[o[0]][m]||0),0)+agendaList().filter(a=>a.statut!=="annule"&&!offreOfAgenda(a)&&(a.date||"").slice(0,7)===m).reduce((s,a)=>s+encaisseOf(a),0)}
function encaisseOfMonth(m){let s=pensionOfMonth(m);agendaList().filter(a=>a.statut!=="annule"&&(a.date||"").slice(0,7)===m).forEach(a=>s+=encaisseOf(a));elevesList().forEach(e=>(e.paiements||[]).forEach(p=>{if((p.date||"").slice(0,7)===m)s+=num(p.montant)}));return s}
function aEncaisser(){return agendaList().filter(a=>a.statut!=="annule"&&resteOf(a)>0).map(a=>({a,reste:resteOf(a),late:(a.dateFin||a.date)<today()})).sort((x,y)=>x.a.date.localeCompare(y.a.date))}
function soinsDus(){const lim=addDays(3);const out=[];chevauxList().forEach(h=>(h.soins||[]).forEach(s=>{if(s.prochain&&s.prochain<=lim&&!(h.soins||[]).some(z=>z.type===s.type&&z.date>=s.prochain))out.push({h,s})}));return out}

function lineChart(keys,series){

  keys.forEach((k,i)=>{ax+='<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+parse(k+"-01").toLocaleDateString("fr-FR",{month:"short"})+'</text>'});ax+='</g>';

  labs.sort((a,b)=>a.y-b.y);for(let i=1;i<labs.length;i++)if(labs[i].y-labs[i-1].y<15)labs[i].y=labs[i-1].y+15;
  const lt=labs.map(l=>'<circle cx="'+(L+iw+12)+'" cy="'+(l.y-4)+'" r="4" fill="'+l.col+'"/><text class="lab" x="'+(L+iw+20)+'" y="'+l.y+'">'+esc(l.lab)+'</text>').join("");

  S.lc={keys,series};

function clientsAll(){
  const M={};const add=(nom,tel,email,item)=>{const k=ckey(nom,tel);if(!k)return;const c=M[k]||(M[k]={key:k,nom:"",tel:"",email:"",items:[],total:0,last:""});if(nom&&(!c.nom||c.nom.length<String(nom).length))c.nom=String(nom).trim();if(tel&&!c.tel)c.tel=tel;if(email&&!c.email)c.email=email;if(item){c.items.push(item);c.total+=num(item.montant);if((item.date||"")>c.last)c.last=item.date||""}};
  agendaList().filter(a=>a.statut!=="annule").forEach(a=>{const ty=tyOf(a);if(a.client&&a.client.nom&&!["rdv","appel","autre"].includes(ty))add(a.client.nom,a.client.tel,a.client.email,{date:a.date,label:tLab(ty),ty,montant:RESA_KINDS.includes(a.kind)?0:revenueOfAgenda(a),src:"agenda",id:a._id});
    if(RESA_KINDS.includes(a.kind))(a.resas||[]).forEach(r=>{if(r.nom)add(r.nom,r.tel,"",{date:a.date,label:tLab(ty)+" · "+(num(r.adultes)+num(r.enfants))+" pers.",ty,montant:num(r.adultes)*num(a.prixAdulte)+num(r.enfants)*num(a.prixEnfant),src:"agenda",id:a._id})})});
  elevesList().forEach(e=>add(e.nom,e.tel,"",{date:(e.seances||[]).map(s=>s.date).sort().pop()||"",label:"Élève · "+tLab(offreOfEleve(e)),ty:offreOfEleve(e),montant:(e.paiements||[]).reduce((s,p)=>s+num(p.montant),0),src:"eleve",id:e._id}));

  Object.entries(S.clientsDb||{}).forEach(([k,c])=>{const x=M[k]||(M[k]={key:k,nom:"",tel:"",email:"",items:[],total:0,last:""});CFIELDS.forEach(f=>{if(c[f])x[f]=c[f]});x.tags=c.tags||[];x.interets=c.interets||[];x.suivi=c.suivi||[];(c.achats||[]).forEach((a,i)=>{x.items.push({date:a.date,label:(OF[a.offre]?tLab(a.offre):"Achat")+(a.note?" · "+a.note:"")+" (ajouté à la main)",ty:a.offre,montant:num(a.montant),src:"manuel",idx:i});x.total+=num(a.montant);if((a.date||"")>x.last)x.last=a.date||""});(x.suivi||[]).forEach(s=>{if((s.date||"")>x.last)x.last=s.date})});
  const nn=x=>String(x||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  Object.keys(M).filter(k=>k.startsWith("n-")).forEach(k=>{const c=M[k];const t=Object.values(M).find(o=>o.key.startsWith("t")&&nn(o.nom)===nn(c.nom));if(t&&!(S.clientsDb||{})[k]){t.items=t.items.concat(c.items);t.total+=c.total;if(c.last>t.last)t.last=c.last;delete M[k]}});
  Object.values(M).forEach(c=>{c.tags=c.tags||[];c.interets=c.interets||[];const seen=new Set(c.items.map(i=>i.ty).filter(t=>OF[t]));c.offresVues=[...seen]});
  return Object.values(M).filter(c=>(c.nom||c.tel)&&!((S.clientsDb||{})[c.key]||{}).cache);
}

function prevMonth(m){const d=parse(m+"-01");d.setMonth(d.getMonth()-1);return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function delta(cur,prev,invert){if(!prev&&!cur)return "";if(!prev)return '<span class="delta '+(invert?"down":"up")+'">nouveau</span>';const p=Math.round((cur-prev)/Math.abs(prev)*100);if(!p)return '<span class="delta">= mois dernier</span>';const good=invert?p<0:p>0;return '<span class="delta '+(good?"up":"down")+'">'+(p>0?"▲ +":"▼ ")+p+' % vs mois dernier</span>'}

function moneyTiles(m){const pm=prevMonth(m);const rec=recettesOfMonth(m),rp=recettesOfMonth(pm);const dep=depensesOfMonth(m).reduce((s,x)=>s+x.montant,0),dp=depensesOfMonth(pm).reduce((s,x)=>s+x.montant,0);const ben=rec-dep,bp=rp-dp;const enc=encaisseOfMonth(m),ep=encaisseOfMonth(pm);
  return '<div class="strip">'+cellP(money(rec),"💰 Déjà rentré"+delta(rec,rp))+cellP(money(dep),"Dépenses"+delta(dep,dp,true))+'<div class="cell'+(ben<0?" alert":"")+'"><div class="n" style="color:'+(ben<0?"var(--bad)":"var(--ok)")+'">'+money(ben)+'</div><div class="l">Bénéfice'+delta(ben,bp)+'</div></div>'+(()=>{const av=aVenirMonth(m),op=optionMonth(m);return '<div class="cell avenir"><div class="n">'+money(av)+'</div><div class="l">⏳ À venir (confirmé, pas encore payé)'+(op?'<span class="delta" style="color:var(--muted)">+ '+money(op).replace(/<[^>]+>.*$/,"")+' en option, pas compté</span>':"")+'</div></div>'})()+'</div><p class="muted" style="margin:-6px 0 14px;font-size:13px">Recettes, bénéfice et statistiques ne comptent que l\'argent déjà rentré. Ce qui n\'est pas confirmé (option, prospect) n\'est jamais compté.</p>'}

/* ================= animations ================= */
function animateEnter(){const v=$("#view");if(!v)return;const key=S.tab+"|"+(S.route?S.route.page+":"+(S.route.id||"new"):"");
  if(key!==S.lastKey){S.lastKey=key;v.classList.remove("enter");void v.offsetWidth;v.classList.add("enter");clearTimeout(animateEnter.t);animateEnter.t=setTimeout(()=>v.classList.remove("enter"),900);countUp()}
  if(S.calAnim){const g=document.querySelector(".cal-grid,.tg");if(g){g.classList.add("cal-"+S.calAnim)}S.calAnim=null}}

async function moveProspect(id,col){const cur=S.pub[id];if(!cur)return;if(col==='attente'&&S.priv[id]&&S.priv[id].prochaine&&S.priv[id].prochaine.date){const pv={...S.priv[id],prochaine:{type:'appel',date:'',texte:''}};S.priv[id]=pv;write('prive/'+id,pv)}
  const n={...cur,updatedAt:new Date().toISOString()};
  n.col=col;if(col==="appel"||col==="visite"){n.statut="nouveau";n.paye=false}
  else if(col==="relance"){n.statut=cur.statut==="proposition"?"proposition":"contacte";n.paye=false}
  else if(col==="signe"){n.statut="reserve";n.paye=false}
  else if(col==="paye"){n.statut="reserve";n.paye=true}
  else if(col==="attente"){n.statut="attente";n.paye=false}
  else if(col==="perdu"){n.statut="perdu";n.paye=false;if(!n.raisonPerte)n.raisonPerte=""}

  else{S.pub[id]=old;render()}
}

function agBoxes(L,ed){const by={};L.forEach(x=>{const c=catOf(x);(by[c]=by[c]||[]).push(x)});
  return '<div class="ag-boxes">'+CATS.filter(c=>by[c[0]]).map(([id])=>{const c=CATM[id];const l=by[id].sort((a,b)=>(a.fait?1:0)-(b.fait?1:0));
    return '<div class="ag-box" style="--cc:'+c.c+';--cb:'+c.bg+'"><div class="ag-bh"><span class="ag-ic">'+c.ic+'</span><b>'+esc(c.l)+'</b><span class="count">'+l.filter(x=>!x.fait).length+'</span></div>'+l.map(x=>agTask(x,ed)).join("")+'</div>'}).join("")+'</div>'}
function viewAgenda(){
  const ed=canAgenda();const all=agendaAll().filter(x=>!x.fait||(x.faitLe||"")>=today());
  const draftCat=S.agCat||guessCat(S.agTxt||"");
  let h='<div class="calfilt"><button type="button" class="hchip agchip on" data-calmode="cal">📅 Calendrier</button><button type="button" class="hchip" aria-pressed="true">📋 Agenda</button></div>';

    '<div class="ag-cats">'+CATS.map(([id])=>{const c=CATM[id];return '<button type="button" class="ag-cat" data-agcat="'+id+'" aria-pressed="'+(draftCat===id)+'" style="--cc:'+c.c+';--cb:'+c.bg+'">'+c.ic+' '+esc(c.l)+'</button>'}).join("")+'</div></div>';
  const by={};all.forEach(x=>{const c=catOf(x);(by[c]=by[c]||[]).push(x)});

  h+='<div class="ag-sum"><b>'+open+'</b> chose'+(open>1?"s":"")+' à faire'+(open?' · touchez une bulle pour la modifier ou la cocher':'')+'</div>';

  h+='<div class="ag-grid">'+order.map(id=>{const c=CATM[id];const l=(by[id]||[]).sort((a,b)=>(a.fait?1:0)-(b.fait?1:0)||(a.cree||"").localeCompare(b.cree||""));const n=l.filter(x=>!x.fait).length;
    return '<div class="ag-tile'+(n?"":" empty")+'" style="--cc:'+c.c+';--cb:'+c.bg+'"><div class="ag-th"><span class="ag-ic">'+c.ic+'</span><b>'+esc(c.l)+'</b>'+(n?'<span class="ag-n">'+n+'</span>':"")+'</div>'+
      (l.length?'<div class="ag-bubbles">'+l.map(x=>'<span class="ag-bub'+(x.fait?" done":"")+'"><button type="button" class="ag-bt" data-agdone="'+esc(x._id)+'"'+(ed?"":" disabled")+' title="'+(x.fait?"Remettre à faire":"Marquer comme fait")+'">'+(x.fait?"✓ ":"")+esc(x.texte)+'</button>'+(ed?'<button type="button" class="ag-x" data-todo-del="'+esc(x._id)+'" aria-label="Supprimer">✕</button>':"")+'</span>').join("")+'</div>':'<span class="ag-none">Rien à faire</span>')+'</div>'}).join("")+'</div>';
  return h;

function walletOf(st){const L=st.porteMonnaie||[];const don=L.filter(w=>w.sens==="donne").reduce((a,w)=>a+num(w.montant),0),dep=L.filter(w=>w.sens==="depense").reduce((a,w)=>a+num(w.montant),0);return {L,don,dep,reste:don-dep}}
function avancesOf(st,m){return (st.porteMonnaie||[]).filter(w=>w.sens==="avance"&&(!m||(w.date||"").slice(0,7)===m)).reduce((a,w)=>a+num(w.montant),0)}
function gainsOf(st,m){const tm=today().slice(0,7);let gagne=0,paye=0;
  if(isMois(st)){gagne=num(st.tarif);const x=(st.mois||{})[m];paye=x&&x.paye?moisOf(st,m).montant:0}
  else{const first=m+"-01";const ld=iso(new Date(Number(m.slice(0,4)),Number(m.slice(5,7)),0));const end=m===tm?today():ld;const sh=first<=end?shiftsBetween(st,first,end).filter(x=>!x.absent):[];gagne=sh.reduce((a,x)=>a+x.montant,0);paye=sh.filter(x=>x.paye).reduce((a,x)=>a+x.montant,0)}
  const av=avancesOf(st,m);return {gagne,paye,av,reste:gagne-paye-av}}
function walletCards(){const P=staffList().filter(x=>x.actif!==false&&x.epingle);if(!P.length)return "";const ed=canAgenda();
  const dh=v=>Math.round(v).toLocaleString("fr-FR")+" DH";
  return '<section class="section"><div class="wallets">'+P.map(st=>{const w=walletOf(st);const id=esc(st._id);const f=(S.wForm||{})[st._id]||"";
    const m=today().slice(0,7);const g=gainsOf(st,m);const mn=parse(m+"-01").toLocaleDateString("fr-FR",{month:"long"});const hasSal=num(st.tarif)>0;const open=(S.wHist||{})[st._id];
    let h='<div class="card wallet cw" style="'+staffColVars(st)+'"><div class="w-head"><button class="w-name" data-item="staff" data-id="'+id+'"><b>⭐ '+esc((st.nom||"").trim())+'</b><span class="w-role">'+esc(st.notes||st.role||"Homme à tout faire")+'</span></button></div>';
    h+='<div class="w-cols"><div class="w-box pm"><span class="w-lbl">👛 Porte-monnaie</span><b class="w-n'+(w.reste<0?" neg":"")+'">'+dh(w.reste)+'</b><div class="w-ln"><span>Donné</span><b>'+dh(w.don)+'</b></div><div class="w-ln"><span>Dépensé</span><b>'+dh(w.dep)+'</b></div></div>';
    h+='<div class="w-box gn"><span class="w-lbl">💵 Ses gains · '+esc(mn)+'</span><b class="w-n'+(hasSal&&g.reste<0?" neg":"")+'">'+(hasSal?dh(g.reste):dh(g.av))+'</b><small class="w-sub">'+(hasSal?(g.reste<0?"payé en trop":"reste à lui payer"):"avances ce mois")+'</small><div class="w-ln"><span>Salaire</span><b>'+(hasSal?dh(g.gagne):'<i>à mettre</i>')+'</b></div><div class="w-ln"><span>Avances</span><b>'+dh(g.av)+'</b></div><div class="w-ln"><span>Déjà payé</span><b>'+dh(g.paye)+'</b></div></div>';
    if(ed)h+='<div class="w-btns"><button class="btn w-in'+(f==="donne"?" on":"")+'" data-wform="'+id+'|donne">+ Donner</button><button class="btn w-out'+(f==="depense"?" on":"")+'" data-wform="'+id+'|depense">− Dépense</button><button class="btn w-av'+(f==="avance"?" on":"")+'" data-wform="'+id+'|avance">💵 Avance</button><button class="btn w-hist'+(open?" on":"")+'" data-whist="'+id+'">📜 '+w.L.length+'</button></div>';
    h+='</div>';
    if(ed&&f)h+='<div class="w-add"><input id="wN-'+id+'" placeholder="'+(f==="donne"?"Ex. pour les courses de la semaine":f==="avance"?"Ex. avance pour sa famille":"Ex. ampoules, essence, foin")+'"><input type="number" min="0" inputmode="numeric" id="wM-'+id+'" placeholder="Montant (DH)"><input type="date" id="wD-'+id+'" value="'+today()+'"><button class="btn primary" data-wadd="'+id+'|'+f+'">'+(f==="donne"?"Ajouter l\'argent donné":f==="avance"?"Ajouter l\'avance":"Ajouter la dépense")+'</button></div>';
    if(open)h+=w.L.length?'<div class="w-list">'+w.L.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.cree||"").localeCompare(a.cree||"")).map(x=>'<div class="w-i '+x.sens+'"><span class="w-s">'+(x.sens==="donne"?"+":x.sens==="avance"?"💵":"−")+'</span><span class="w-t"><b>'+(x.sens==="avance"?"Avance sur salaire"+(x.note?" · ":""):"")+esc(x.note||(x.sens==="donne"?"Argent donné":x.sens==="avance"?"":"Dépense"))+'</b><small>'+fmtDate(x.date)+'</small></span><b class="w-m">'+(x.sens==="donne"?"+":x.sens==="avance"?"":"−")+dh(num(x.montant))+'</b>'+(ed?'<button class="btn small ghost" data-wdel="'+id+'|'+esc(x.id)+'" aria-label="Supprimer">✕</button>':"")+'</div>').join("")+'</div>':'<p class="muted" style="margin:0;font-size:14px">Aucun mouvement pour l\'instant.</p>';
    return h+'</div>'}).join("")+'</div></section>'}

function moi(){return (S.priv&&S.priv._moi)||{}}
function moiPct(){return num(moi().pct)}
async function saveMoi(patch){const d={...moi(),...patch,updatedAt:new Date().toISOString()};S.priv=S.priv||{};S.priv._moi=d;return await write("prive/_moi",d)}
function apportItems(){const out=[];
  agendaList().filter(a=>a.apporteur&&a.statut!=="annule").forEach(a=>{const enc=encaisseOf(a);out.push({src:"agenda",id:a._id,date:a.date,client:(a.client&&a.client.nom)||((a.resas||[])[0]||{}).nom||titreEv(a),offre:tyOf(a),total:revenueOfAgenda(a),enc})});
  elevesList().filter(e=>e.apporteur).forEach(e=>(e.paiements||[]).forEach(p=>out.push({src:"eleve",id:e._id,date:p.date||"",client:e.nom||"Élève",offre:offreOfEleve(e),total:num(p.montant),enc:num(p.montant)})));
  return out.sort((a,b)=>(b.date||"").localeCompare(a.date||""))}
function apportMonth(m){return apportItems().filter(x=>(x.date||"").slice(0,7)===m).reduce((s,x)=>s+x.enc,0)}

  if(!canProspects())return '<div class="empty">Page réservée.</div>';

  const totAll=items.reduce((s,x)=>s+x.enc,0);const partAll=Math.round(totAll*pct/100);

  const caM=apportMonth(m),partM=Math.round(caM*pct/100);

  h+='<div class="cel-top">'+myAgendaHtml()+myNotesHtml()+'</div>';
  h+='<div class="strip">'+cellP(money(solde),"💰 Mon solde à recevoir",solde<0)+cellP(money(partM),"Ma part ce mois-ci")+cellP(money(caM),"Généré par mes clients ce mois-ci")+cellP(money(partAll),"Ma part depuis le début")+'</div>';
  h+='<div class="card" style="margin:16px 0"><h3>Ce que mes clients rapportent · 12 mois</h3><p class="muted" style="margin:0 0 6px;font-size:13px">Bleu : total généré par mes clients · Or : ce que je prends ('+pct+' %).</p>'+lineChart(keys,[{lab:"Total généré",vals:tv,col:"#2a78d6"},{lab:"Ma part",vals:pv,col:"#d29a0e"}])+'</div>';
  h+='<div class="strip" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">'+cellP(money(surPlace),"Sur place (cours, stages, visites…)")+cellP(money(enLigne),"Formation en ligne")+cellP(new Set(items.map(x=>normTxt(x.client))).size,"Clients apportés")+'</div>';
  const by={};items.forEach(x=>{const k=normTxt(x.client);(by[k]=by[k]||{nom:x.client,enc:0,offres:new Set(),last:"",ref:x}).enc+=x.enc;by[k].offres.add(OF[x.offre]?OF[x.offre].nom:tLab(x.offre));if((x.date||"")>by[k].last)by[k].last=x.date});
  const L=Object.values(by).sort((a,b)=>b.enc-a.enc);

    (L.length?'<div class="list">'+L.map(c=>'<button class="item" '+(c.ref.src==="agenda"?'data-item="agenda" data-id="'+esc(c.ref.id)+'"':'data-item="eleve" data-id="'+esc(c.ref.id)+'"')+'><span class="bar" style="background:#d29a0e"></span><span style="min-width:0"><b>'+esc(c.nom)+'</b><span class="sub">'+esc([...c.offres].join(", "))+(c.last?' · '+fmtDate(c.last):"")+'</span></span><span style="text-align:right;font-size:14px"><b>'+money(c.enc)+'</b><br><span class="muted" style="font-size:12.5px">ma part '+Math.round(c.enc*pct/100).toLocaleString("fr-FR")+' DH</span></span></button>').join("")+'</div>':'<div class="empty">Aucun client compté pour l\'instant. Dans la fiche d\'une activité, d\'un élève ou d\'un prospect, cochez <b>⭐ Client apporté par Céleste</b>.</div>')+'</section>'+

    const b=e.target.closest("[data-tm]");if(e.target!==r&&!b)return;e.stopPropagation();const act=b?b.dataset.tm:"";const txt=($("#tmTxt")||{}).value;r.remove();if(!act)return;
    const prev={...cur};
    if(act==="save"){const v=String(txt||"").trim();if(!v){toast("Le texte est vide");return}await taskPut(kind,id,{...cur,texte:v,cat});toastUndo("Modifié",()=>taskPut(kind,id,prev))}
    else if(act==="done"){const d={...cur,texte:String(txt||cur.texte).trim()||cur.texte,cat,fait:!cur.fait,faitLe:!cur.fait?today():""};await taskPut(kind,id,d);toastUndo(d.fait?"Bravo, c'est fait ✓":"Remis à faire",()=>taskPut(kind,id,prev))}
    else if(act==="del"){await taskPut(kind,id,null);toastUndo("Supprimé",()=>taskPut(kind,id,prev))}});
}

function navSnap(){return {tab:S.tab,route:S.route&&S.route.page!=="reglages"?{...S.route}:null,calMode:S.calMode,ctab:S.ctab,adtab:S.adtab}}
function navKey(n){return [n.tab,n.route?n.route.page+":"+(n.route.id||""):"",n.tab==="calendrier"?n.calMode||"":"",n.tab==="clients"?n.ctab||"":"",n.tab==="admin"?n.adtab||"":""].join("|")}
function navTrack(){const n=navSnap();const k=navKey(n);if(S.navCur===undefined){S.navCur=k;S.navCurSnap=n;S.nav=[];return}
  if(k===S.navCur){S.navCurSnap=n;return}
  if(S.navBacking){S.navBacking=false}
  else{const top=S.nav[S.nav.length-1];if(top&&navKey(top)===k)S.nav.pop();else if(!(S.navCurSnap.route&&!S.navCurSnap.route.id)){S.nav.push(S.navCurSnap);if(S.nav.length>40)S.nav.shift()}}
  S.navCur=k;S.navCurSnap=n}
function navBack(){const n=S.nav.pop();if(!n){go("accueil");return}
  if(S.route&&!go.force&&!leaveOk()){S.nav.push(n);return}
  S.navBacking=true;S.calMode=n.calMode;S.ctab=n.ctab;S.adtab=n.adtab;go(n.tab,n.route?{...n.route}:null)}
document.addEventListener("click",e=>{if(e.target.closest("[data-navback]"))navBack()});

async function maybeImportNotes(){if(maybeImportNotes.busy||!S.priv||S.role!=="owner")return;
  const done=((S.priv._agenda||{}).imports)||[];const todo=Object.keys(NOTE_IMPORTS).filter(k=>!done.includes(k));if(!todo.length)return;
  const phones=[...new Set(Object.values(S.priv).map(d=>String((d&&d.telephone)||"").replace(/\D/g,"")).filter(x=>x.length>=8))];if(!phones.length)return;
  maybeImportNotes.busy=true;
  try{for(const k of todo){const [sa,iv,ct]=NOTE_IMPORTS[k].split(".").map(b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)));let L=null;
    for(const ph of phones){try{const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(ph),"PBKDF2",false,["deriveKey"]);const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:sa,iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);L=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct)));break}catch(_){}}
    if(!L)continue;const now=new Date().toISOString();const cur=S.priv._agenda||{};const items=(cur.items||[]).concat(L.map(([t,c],i)=>({id:newId("m")+i,texte:t,cat:c,fait:false,cree:now})));
    const d={...cur,items,imports:[...(cur.imports||[]),k],updatedAt:now};S.priv._agenda=d;if(await write("prive/_agenda",d)){render();toast(L.length+" tâches ajoutées dans Mon agenda")}}}
  finally{maybeImportNotes.busy=false}}

/* ================= rendu ================= */
function render(){
  $("#todayLabel").textContent=new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  if(!tabsFor().some(([k])=>k===S.tab))S.tab="accueil";
  renderTabs();
  if(!S.db){$("#view").innerHTML='<div class="notice">Le logiciel n\'a pas pu se connecter à ses données. Ouvrez la page en étant connectée à votre compte Claude, puis rechargez-la.</div>';return}
  if(!S.loaded){$("#view").innerHTML='<div class="empty">Chargement…</div>';return}
  let html;
  if(S.route&&S.route.page==="event")html=viewEvent();
  else if(S.route&&S.route.page==="eleve")html=viewEleve();
  else if(S.route&&S.route.page==="staff")html=viewStaff();
  else if(S.route&&S.route.page==="offre")html=viewOffre();
  else if(S.route&&S.route.page==="client")html=viewClient();
  else if(S.route&&S.route.page==="cheval")html=viewCheval();
  else if(S.tab==="reglages"){if(!S.route)S.route={page:"reglages"};html=viewReglages()}
  else html=({accueil:viewAccueil,evenements:viewEvenements,formations:viewFormations,cours:viewCours,prospects:viewProspects,stats:viewArgentTab,personnel:viewPersonnel,offres:viewOffres,calendrier:viewCalendrier,evenements:viewCalendrier,formations:viewCalendrier,cours:viewCalendrier,clients:viewClientsTab,argent:viewArgentTab,celeste:viewCeleste,admin:viewAdmin,chevaux:viewChevaux}[S.tab])();
  const ae=document.activeElement;const k=ae&&ae.dataset&&ae.dataset.k;
  navTrack();
  if(!S.route||S.route.page==="reglages"){if((S.nav||[]).length)html='<button type="button" class="navback" data-navback aria-label="Retour à la page précédente">‹ Retour</button>'+html}
  $("#view").innerHTML=html;animateEnter();setTimeout(maybeImportNotes,0);
  if(k){const el=document.querySelector('[data-k="'+k+'"]');if(el)el.focus()}
}

async function boot(){
  render();
  if(!window.claude||!window.claude.use){render();return}
  const [db,user,assets,downloads]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("assets"),claude.use("downloads")]);S.assets=assets;S.downloads=downloads;

  let owner=false,edit=false;

  db.doc("reglages/devise").onSnapshot(d=>{const v=d.exists&&Number((d.data()||{}).eurDh);if(v>1){S.rate=v;onData()}},()=>{});
  if(S.uid)db.collection("data/users/"+S.uid).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S.myPerso=o;onData()},()=>{});
  if(owner)db.collection("prive").onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});S.priv=o;onData()},()=>{});
}
